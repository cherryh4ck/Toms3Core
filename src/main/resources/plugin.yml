name: Toms3Core
version: '${version}'
main: io.github.Cherryh4ck.toms3Core.Toms3Core
api-version: '1.21'
authors: [ Cherryh4ck ]
description: Core for anarchy servers
commands:
  tmcore:
    description: Toms3Core main command
    usage: /tmcore [option]
    permission: tmcore.main
  playtime:
    description: Shows the playtime of a player
    usage: /playtime [player]
    aliases: pt
  joindate:
    description: Shows player's joindate
    usage: /joindate
    aliases: jd
  lastseen:
    description: Shows player's last seen date
    usage: /lastseen
    aliases: ls
  seed:
    description: Joke command
    usage: /seed

permissions:
  tmcore.main:
    description: Toms3Core main command permission
    default: op